<template>
    <div class={generateMessageBubbleClassname}>
        <template lwc:if={isProductRecommendations}>
            <c-product-recommendation-grid-message-component
                product-data={productData}
                products-description={productsDescription}
                category-data={categoryData}
                categories-description={categoriesDescription}
                onaddtocart={handleAddToCart}
                onselectcategory={handleSelectCategory}>
            </c-product-recommendation-grid-message-component>
        </template>
        <template lwc:else>
            <lightning-formatted-rich-text value={textContent}></lightning-formatted-rich-text>
        </template>
    </div>
</template>
